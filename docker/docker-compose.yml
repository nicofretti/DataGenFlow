services:
  datagenflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: datagenflow:local
    container_name: datagenflow
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATAGENFLOW_HOT_RELOAD=true
    volumes:
      # data persistence
      - ./data:/app/data
      # user extensions (create these directories in your project)
      - ./user_blocks:/app/user_blocks
      - ./user_templates:/app/user_templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

